name: Release signed macOS arm64

# The signed channel is deliberately operator-initiated. It never runs on a
# push, tag, pull request, or schedule and it never publishes the draft it creates.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact source version to release, for example 0.2.1
        required: true
        type: string
      resume_run_id:
        description: Optional exact prior workflow run ID whose sealed signed-transfer artifact must be reused
        required: false
        type: string
      resume_release_id:
        description: Optional exact existing draft Release ID; must be supplied with resume_run_id
        required: false
        type: string

concurrency:
  group: release-macos-arm64-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate immutable release source
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      resume: ${{ steps.version.outputs.resume }}
    steps:
      - name: Check out the manually selected source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reject stale, non-main, or previously used release sources
        env:
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RESUME_RELEASE_ID: ${{ inputs.resume_release_id }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          if { [ -n "$RESUME_RUN_ID" ] && [ -z "$RESUME_RELEASE_ID" ]; } || \
             { [ -z "$RESUME_RUN_ID" ] && [ -n "$RESUME_RELEASE_ID" ]; }; then
            echo "resume_run_id and resume_release_id must be supplied together." >&2
            exit 1
          fi
          if [ -n "$RESUME_RUN_ID" ]; then
            [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$RESUME_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          command=(node scripts/release-github.mjs preflight --output "$RUNNER_TEMP/release-preflight.json")
          if [ -n "$RESUME_RUN_ID" ]; then
            command+=(--resume-release-id "$RESUME_RELEASE_ID")
          fi
          "${command[@]}"

      - name: Verify source versions and updater configuration
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "The manually supplied version is not a supported SemVer release version." >&2
            exit 1
          fi
          test -f "docs/release-notes/v$REQUESTED_VERSION.md"
          ./scripts/check-version-sync.sh "$REQUESTED_VERSION"
          EXPECTED_UPDATER_ENDPOINT="$EXPECTED_UPDATER_ENDPOINT" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const releaseConfig = JSON.parse(readFileSync("src-tauri/tauri.updater.conf.json", "utf8"));
            const updater = config.plugins?.updater;
            if (releaseConfig.bundle?.createUpdaterArtifacts !== true) throw new Error("release config must enable updater artifacts");
            if (typeof updater?.pubkey !== "string" || updater.pubkey.length === 0) throw new Error("updater public key is required");
            if (!Array.isArray(updater.endpoints) || !updater.endpoints.includes(process.env.EXPECTED_UPDATER_ENDPOINT)) {
              throw new Error("updater endpoint must contain the fixed GitHub latest.json URL");
            }
          '
          grep -Eq '^tauri-plugin-updater[[:space:]]*=' src-tauri/Cargo.toml
          grep -REq 'tauri_plugin_updater::' src-tauri/src
          npm run release:dry-run
          printf 'value=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$RESUME_RUN_ID" ]; then
            printf 'resume=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'resume=false\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build secret-free release input
    needs: preflight
    if: ${{ inputs.resume_run_id == '' }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out the validated source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the runner is macOS arm64
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up the locked Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable on 2026-08-27
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install locked frontend dependencies
        run: npm ci

      - name: JavaScript checks and production build
        run: npm run check && npm run build

      - name: Secret regression scan
        run: ./scripts/scan-secrets.sh

      - name: Rust checks
        run: cargo fmt --all -- --check && cargo check --workspace --all-targets && cargo test --workspace && cargo clippy --workspace --all-targets -- -D warnings

      - name: Install locked release-audit tools
        run: cargo install cargo-audit --locked --version 0.22.2 && cargo install cargo-cyclonedx --locked --version 0.5.9 && cargo install cargo-license --locked --version 0.7.0

      - name: Dependency audit
        run: ./scripts/audit-dependencies.sh

      - name: Generate SBOM and license inventories
        run: ./scripts/sbom.sh && ./scripts/licenses.sh && shasum -a 256 -c artifacts/release/sbom/SHA256SUMS

      - name: Build the unsigned app input
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          npm run tauri -- build --target aarch64-apple-darwin --bundles app --no-sign
          app_bundle="$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$app_bundle"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
          [[ "$(file "$app_bundle/Contents/MacOS/$executable")" == *"Mach-O 64-bit executable arm64"* ]]
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_bundle/Contents/Info.plist")" = "$VERSION"

      - name: Package the immutable signing input
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          app_bundle="$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          input_root="$RUNNER_TEMP/codex-manager-release-input"
          upload_root="artifacts/signing-input"
          rm -rf -- "$input_root" "$upload_root"
          mkdir -p "$input_root/artifacts/release" "$input_root/tools" "$upload_root"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$input_root/unsigned-app.zip"
          ditto artifacts/release/sbom "$input_root/artifacts/release/sbom"
          ditto artifacts/release/licenses "$input_root/artifacts/release/licenses"
          cp "docs/release-notes/v$VERSION.md" "$input_root/RELEASE-NOTES.md"
          PUBLIC_KEY_PATH="$input_root/tools/updater.pub" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const encoded = config.plugins?.updater?.pubkey;
            if (typeof encoded !== "string" || encoded.length === 0) throw new Error("updater public key is missing");
            const decoded = Buffer.from(encoded, "base64");
            if (decoded.length === 0) throw new Error("updater public key is invalid");
            writeFileSync(process.env.PUBLIC_KEY_PATH, decoded, { mode: 0o600 });
          '
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          macos_version="$(sw_vers -productVersion)"
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          gh_version="$(gh --version | sed -n '1p')"
          jq -n \
            --arg version "$VERSION" --arg repository "$REPOSITORY" --arg sourceSha "$SOURCE_SHA" --arg sourceRef refs/heads/main \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg target aarch64-apple-darwin \
            --arg imageOS "$ImageOS" --arg imageVersion "$ImageVersion" \
            --arg macOSVersion "$macos_version" --arg xcodeVersion "$xcode_version" \
            --arg node "$(node --version)" --arg npm "$(npm --version)" \
            --arg rustc "$(rustc --version)" --arg cargo "$(cargo --version)" \
            --arg tauri "$(node node_modules/@tauri-apps/cli/tauri.js --version)" --arg gh "$gh_version" \
            '{schemaVersion:2,version:$version,source:{repository:$repository,sha:$sourceSha,ref:$sourceRef,workflowRef:$workflowRef,runId:$runId,runAttempt:$runAttempt},target:$target,runner:{imageOS:$imageOS,imageVersion:$imageVersion,macOSVersion:$macOSVersion,xcodeVersion:$xcodeVersion},toolchain:{node:$node,npm:$npm,rustc:$rustc,cargo:$cargo,tauri:$tauri,gh:$gh}}' \
            > "$input_root/BUILD-INPUT.json"
          archive="$upload_root/codex-manager-v$VERSION-signing-input.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$input_root" .
          (cd "$upload_root" && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Upload the secret-free signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-manager-macos-${{ needs.preflight.outputs.version }}-signing-input
          path: artifacts/signing-input/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign, notarize, staple, and seal artifacts
    needs: [preflight, build]
    if: ${{ inputs.resume_run_id == '' }}
    runs-on: macos-15
    timeout-minutes: 180
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the exact release control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js for the integrity-pinned signer and evidence validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify the runner is macOS arm64
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Download the immutable signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-manager-macos-${{ needs.preflight.outputs.version }}-signing-input
          path: signing-input

      - name: Verify signing input and recheck remote main after approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          archive="signing-input/codex-manager-v$VERSION-signing-input.tar.gz"
          (cd signing-input && shasum -a 256 -c "$(basename "$archive").sha256")
          input_root="$RUNNER_TEMP/codex-manager-release-input"
          rm -rf -- "$input_root"
          mkdir -p "$input_root"
          tar -xzf "$archive" -C "$input_root"
          REPOSITORY="$REPOSITORY" VERSION="$VERSION" SOURCE_SHA="$SOURCE_SHA" BUILD_INPUT="$input_root/BUILD-INPUT.json" \
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { validateBuildInput } from "./scripts/release-state.mjs";
              validateBuildInput(JSON.parse(readFileSync(process.env.BUILD_INPUT, "utf8")), {
                repository: process.env.REPOSITORY,
                version: process.env.VERSION,
                sourceSha: process.env.SOURCE_SHA,
              });
            '
          node scripts/release-github.mjs preflight --output "$RUNNER_TEMP/post-approval-preflight.json"

      - name: Install the updater signer from integrity-pinned packages
        run: |
          set -euo pipefail
          signer_root="$RUNNER_TEMP/codex-manager-tauri-signer"
          cli_archive="$RUNNER_TEMP/tauri-cli-2.11.4.tgz"
          native_archive="$RUNNER_TEMP/tauri-cli-darwin-arm64-2.11.4.tgz"
          rm -rf -- "$signer_root"
          rm -f -- "$cli_archive" "$native_archive"
          mkdir -p "$signer_root/cli" "$signer_root/native"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            'https://registry.npmjs.org/@tauri-apps/cli/-/cli-2.11.4.tgz' --output "$cli_archive"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            'https://registry.npmjs.org/@tauri-apps/cli-darwin-arm64/-/cli-darwin-arm64-2.11.4.tgz' --output "$native_archive"
          cli_integrity="sha512-$(openssl dgst -sha512 -binary "$cli_archive" | openssl base64 -A)"
          native_integrity="sha512-$(openssl dgst -sha512 -binary "$native_archive" | openssl base64 -A)"
          test "$cli_integrity" = 'sha512-R8xGtMpwyetawSqm9kYOuMmEqkhUbvcUy8n0aNXIxollKBLESUu5f4Fx+64hgASYm1H+jSWq6jCW6zqTnH6hqQ=='
          test "$native_integrity" = 'sha512-1ryOF3ZhpZ/nemHV5zVwBQBz9jDGKmKPvWPADOhc83ig0P4bMc2iER4NbC6r9sjeIZ6RVQ4g3RZIYvezhcl4TQ=='
          tar -xzf "$cli_archive" -C "$signer_root/cli" --strip-components=1
          tar -xzf "$native_archive" -C "$signer_root/native" --strip-components=1
          cp "$signer_root/native/cli.darwin-arm64.node" "$signer_root/cli/cli.darwin-arm64.node"
          chmod 700 "$signer_root/cli/tauri.js"
          test "$(node "$signer_root/cli/tauri.js" --version)" = 'tauri-cli 2.11.4'
          rm -f -- "$cli_archive" "$native_archive"

      - name: Fail closed when Apple release credentials are unavailable
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required_secrets=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "Required release environment credential $secret_name is unavailable." >&2
              exit 1
            fi
          done
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$APPLE_SIGNING_IDENTITY" == "Developer ID Application: "*" ($APPLE_TEAM_ID)" ]]

      - name: Import the Developer ID certificate into an ephemeral keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/codex-manager-certificate.p12"
          keychain_path="$RUNNER_TEMP/codex-manager-signing.keychain-db"
          original_keychains="$RUNNER_TEMP/codex-manager-original-keychains.txt"
          notary_profile="codex-manager-notary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          keychain_password="$(openssl rand -base64 32)"
          security list-keychains -d user > "$original_keychains"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 10800 "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="$(sed -E 's/^[[:space:]]*\"?//; s/\"?[[:space:]]*$//' <<< "$existing_keychain")"
            [ -n "$existing_keychain" ] && existing_keychains+=("$existing_keychain")
          done < "$original_keychains"
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          rm -f -- "$certificate_path"
          identity_info="$(security find-identity -v -p codesigning "$keychain_path")"
          test "$(grep -F -c "\"$APPLE_SIGNING_IDENTITY\"" <<< "$identity_info" || true)" -eq 1
          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --keychain "$keychain_path" --validate >/dev/null

      - name: Sign, notarize, and staple the app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/codex-manager-release-input"
          signing_root="$RUNNER_TEMP/codex-manager-signing-output"
          keychain_path="$RUNNER_TEMP/codex-manager-signing.keychain-db"
          notary_profile="codex-manager-notary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$signing_root"
          mkdir -p "$signing_root/evidence" "$signing_root/release-assets"
          ditto -x -k "$input_root/unsigned-app.zip" "$signing_root/app"
          app_bundle="$(find "$signing_root/app" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$app_bundle"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_bundle/Contents/Info.plist")" = "$VERSION"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
          [[ "$(file "$app_bundle/Contents/MacOS/$executable")" == *"Mach-O 64-bit executable arm64"* ]]
          codesign --deep --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          app_info="$(codesign --display --verbose=4 "$app_bundle" 2>&1)"
          grep -Fqx "Authority=$APPLE_SIGNING_IDENTITY" <<< "$app_info"
          grep -Fqx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$app_info"
          grep -Eq '^CodeDirectory .* flags=.*runtime' <<< "$app_info"
          grep -Eq '^Timestamp=' <<< "$app_info"
          entitlements="$signing_root/evidence/APP-ENTITLEMENTS.plist"
          codesign --display --entitlements :- "$app_bundle" > "$entitlements" 2>/dev/null
          if [ -s "$entitlements" ]; then plutil -lint "$entitlements" >/dev/null; fi
          if grep -Eq 'com\.apple\.security\.(get-task-allow|cs\.disable-library-validation|cs\.allow-unsigned-executable-memory|cs\.allow-dyld-environment-variables)' "$entitlements"; then
            echo "The signed app contains a forbidden release entitlement." >&2
            exit 1
          fi
          app_archive="$signing_root/app-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$app_archive"
          xcrun notarytool submit "$app_archive" --keychain-profile "$notary_profile" --keychain "$keychain_path" \
            --wait --timeout 60m --output-format json \
            | jq -e '{id,status,message:(.message // "")} | select(.status == "Accepted")' > "$signing_root/evidence/APP-NOTARIZATION.json"
          rm -f -- "$app_archive"
          xcrun stapler staple "$app_bundle"
          xcrun stapler validate "$app_bundle"
          app_gatekeeper="$(spctl --assess --type execute --verbose=4 "$app_bundle" 2>&1)"
          grep -Fq 'source=Notarized Developer ID' <<< "$app_gatekeeper"

      - name: Create and sign the updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/codex-manager-release-input"
          signing_root="$RUNNER_TEMP/codex-manager-signing-output"
          signer_root="$RUNNER_TEMP/codex-manager-tauri-signer"
          app_bundle="$(find "$signing_root/app" -maxdepth 1 -type d -name '*.app' -print -quit)"
          tarball="$signing_root/release-assets/codex-manager-v$VERSION-aarch64.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$tarball" -C "$(dirname "$app_bundle")" "$(basename "$app_bundle")"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          node "$signer_root/cli/tauri.js" signer sign "$tarball" >/dev/null
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          test -s "$tarball.sig"
          node scripts/verify-updater-signature.mjs "$tarball" "$tarball.sig" "$input_root/tools/updater.pub"

      - name: Create, sign, notarize, and staple the DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          signing_root="$RUNNER_TEMP/codex-manager-signing-output"
          keychain_path="$RUNNER_TEMP/codex-manager-signing.keychain-db"
          notary_profile="codex-manager-notary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          app_bundle="$(find "$signing_root/app" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_staging="$signing_root/dmg-staging"
          dmg="$signing_root/release-assets/codex-manager-v$VERSION-aarch64.dmg"
          mkdir -p "$dmg_staging"
          ditto "$app_bundle" "$dmg_staging/$(basename "$app_bundle")"
          ln -s /Applications "$dmg_staging/Applications"
          hdiutil create -volname "Codex Manager" -srcfolder "$dmg_staging" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          dmg_info="$(codesign --display --verbose=4 "$dmg" 2>&1)"
          grep -Fqx "Authority=$APPLE_SIGNING_IDENTITY" <<< "$dmg_info"
          grep -Fqx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$dmg_info"
          grep -Eq '^Timestamp=' <<< "$dmg_info"
          xcrun notarytool submit "$dmg" --keychain-profile "$notary_profile" --keychain "$keychain_path" \
            --wait --timeout 60m --output-format json \
            | jq -e '{id,status,message:(.message // "")} | select(.status == "Accepted")' > "$signing_root/evidence/DMG-NOTARIZATION.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          dmg_gatekeeper="$(spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1)"
          grep -Fq 'source=Notarized Developer ID' <<< "$dmg_gatekeeper"

      - name: Verify local signed payload and the apps inside updater and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          signing_root="$RUNNER_TEMP/codex-manager-signing-output"
          input_root="$RUNNER_TEMP/codex-manager-release-input"
          app_bundle="$(find "$signing_root/app" -maxdepth 1 -type d -name '*.app' -print -quit)"
          tarball="$signing_root/release-assets/codex-manager-v$VERSION-aarch64.app.tar.gz"
          dmg="$signing_root/release-assets/codex-manager-v$VERSION-aarch64.dmg"
          verify_app() {
            local candidate="$1"
            local label="$2"
            codesign --verify --deep --strict --verbose=2 "$candidate"
            local info entitlements executable gatekeeper
            info="$(codesign --display --verbose=4 "$candidate" 2>&1)"
            grep -Fqx "Authority=$APPLE_SIGNING_IDENTITY" <<< "$info"
            grep -Fqx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$info"
            grep -Eq '^CodeDirectory .* flags=.*runtime' <<< "$info"
            grep -Eq '^Timestamp=' <<< "$info"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$candidate/Contents/Info.plist")" = "cc.codex.manager"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$candidate/Contents/Info.plist")" = "$VERSION"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$candidate/Contents/Info.plist")" = "$VERSION"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$candidate/Contents/Info.plist")"
            [[ "$(file "$candidate/Contents/MacOS/$executable")" == *"Mach-O 64-bit executable arm64"* ]]
            entitlements="$signing_root/evidence/$label-entitlements.plist"
            codesign --display --entitlements :- "$candidate" > "$entitlements" 2>/dev/null
            if [ -s "$entitlements" ]; then plutil -lint "$entitlements" >/dev/null; fi
            if grep -Eq 'com\.apple\.security\.(get-task-allow|cs\.disable-library-validation|cs\.allow-unsigned-executable-memory|cs\.allow-dyld-environment-variables)' "$entitlements"; then
              echo "A signed app contains a forbidden release entitlement." >&2
              exit 1
            fi
            xcrun stapler validate "$candidate"
            gatekeeper="$(spctl --assess --type execute --verbose=4 "$candidate" 2>&1)"
            grep -Fq 'source=Notarized Developer ID' <<< "$gatekeeper"
          }
          verify_app "$app_bundle" local-app
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          node scripts/verify-updater-signature.mjs "$tarball" "$tarball.sig" "$input_root/tools/updater.pub"
          updater_extract="$signing_root/updater-extract"
          mkdir -p "$updater_extract"
          tar -xzf "$tarball" -C "$updater_extract"
          updater_app="$(find "$updater_extract" -maxdepth 1 -type d -name '*.app' -print -quit)"
          verify_app "$updater_app" updater-app
          mount_point="$signing_root/dmg-mount"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -readonly -nobrowse -noautoopen -mountpoint "$mount_point" >/dev/null
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          test "$(find "$mount_point" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" -eq 2
          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = "/Applications"
          dmg_app="$(find "$mount_point" -maxdepth 1 -type d -name '*.app' -print -quit)"
          verify_app "$dmg_app" dmg-app
          local_cdhash="$(codesign --display --verbose=4 "$app_bundle" 2>&1 | awk -F= '/^CDHash=/{print $2; exit}')"
          updater_cdhash="$(codesign --display --verbose=4 "$updater_app" 2>&1 | awk -F= '/^CDHash=/{print $2; exit}')"
          dmg_cdhash="$(codesign --display --verbose=4 "$dmg_app" 2>&1 | awk -F= '/^CDHash=/{print $2; exit}')"
          test "$local_cdhash" = "$updater_cdhash"
          test "$local_cdhash" = "$dmg_cdhash"
          hdiutil detach "$mount_point"
          trap - EXIT

      - name: Seal SBOM, licenses, signing evidence, and transfer payload
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          signing_root="$RUNNER_TEMP/codex-manager-signing-output"
          input_root="$RUNNER_TEMP/codex-manager-release-input"
          assets="$signing_root/release-assets"
          app_bundle="$(find "$signing_root/app" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg="$assets/codex-manager-v$VERSION-aarch64.dmg"
          (cd "$input_root" && zip -qry "$assets/codex-manager-v$VERSION-sbom.zip" artifacts/release/sbom)
          (cd "$input_root" && zip -qry "$assets/codex-manager-v$VERSION-licenses.zip" artifacts/release/licenses)
          authority_sha256="$(printf '%s' "$APPLE_SIGNING_IDENTITY" | shasum -a 256 | awk '{print $1}')"
          app_cdhash="$(codesign --display --verbose=4 "$app_bundle" 2>&1 | awk -F= '/^CDHash=/{print $2; exit}')"
          dmg_cdhash="$(codesign --display --verbose=4 "$dmg" 2>&1 | awk -F= '/^CDHash=/{print $2; exit}')"
          updater_public_key_sha256="$(shasum -a 256 "$input_root/tools/updater.pub" | awk '{print $1}')"
          cert_dir="$signing_root/evidence/leaf-certificate"
          mkdir -p "$cert_dir"
          (cd "$cert_dir" && codesign --display --extract-certificates "$app_bundle" >/dev/null 2>&1)
          test -s "$cert_dir/codesign0"
          leaf_certificate_sha256="$(shasum -a 256 "$cert_dir/codesign0" | awk '{print $1}')"
          rm -rf -- "$cert_dir"
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_bundle/Contents/Info.plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_bundle/Contents/Info.plist")"
          bundle_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_bundle/Contents/Info.plist")"
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          macos_version="$(sw_vers -productVersion)"
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          gh_version="$(gh --version | sed -n '1p')"
          notarytool_version="$(xcrun notarytool --version | paste -sd ' ' -)"
          signed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "$VERSION" --arg signedAt "$signed_at" --arg sourceSha "$SOURCE_SHA" --arg repository "$REPOSITORY" --arg sourceRef refs/heads/main \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" --arg workflowRunId "$GITHUB_RUN_ID" --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg bundleIdentifier "$bundle_identifier" --arg bundleVersion "$bundle_version" --arg bundleBuild "$bundle_build" \
            --arg imageOS "$ImageOS" --arg imageVersion "$ImageVersion" --arg macOSVersion "$macos_version" \
            --arg xcodeVersion "$xcode_version" --arg nodeVersion "$(node --version)" --arg ghVersion "$gh_version" \
            --arg notarytoolVersion "$notarytool_version" --arg teamId "$APPLE_TEAM_ID" \
            --arg authoritySha256 "$authority_sha256" --arg leafCertificateSha256 "$leaf_certificate_sha256" \
            --arg appCdHash "$app_cdhash" --arg dmgCdHash "$dmg_cdhash" --arg updaterPublicKeySha256 "$updater_public_key_sha256" \
            --slurpfile appNotarization "$signing_root/evidence/APP-NOTARIZATION.json" \
            --slurpfile dmgNotarization "$signing_root/evidence/DMG-NOTARIZATION.json" \
            '{schemaVersion:2,version:$version,signedAt:$signedAt,source:{repository:$repository,sha:$sourceSha,ref:$sourceRef,workflowRef:$workflowRef,runId:$workflowRunId,runAttempt:$workflowRunAttempt},target:{triple:"aarch64-apple-darwin",architecture:"arm64",bundleIdentifier:$bundleIdentifier,bundleVersion:$bundleVersion,bundleBuild:$bundleBuild},signingRunner:{imageOS:$imageOS,imageVersion:$imageVersion,macOSVersion:$macOSVersion,xcodeVersion:$xcodeVersion,nodeVersion:$nodeVersion,ghVersion:$ghVersion,notarytoolVersion:$notarytoolVersion},apple:{teamId:$teamId,authoritySha256:$authoritySha256,leafCertificateSha256:$leafCertificateSha256,app:{cdHash:$appCdHash,notarization:$appNotarization[0],hardenedRuntime:true,secureTimestamp:true,forbiddenEntitlementsAbsent:true,stapled:true,gatekeeperSource:"Notarized Developer ID"},dmg:{cdHash:$dmgCdHash,embeddedAppCdHash:$appCdHash,notarization:$dmgNotarization[0],secureTimestamp:true,stapled:true,gatekeeperSource:"Notarized Developer ID"}},updater:{publicKeySha256:$updaterPublicKeySha256,embeddedAppCdHash:$appCdHash}}' \
            > "$assets/SIGNING-EVIDENCE.json"
          cp "$input_root/RELEASE-NOTES.md" "$signing_root/RELEASE-NOTES.md"
          cp "$input_root/BUILD-INPUT.json" "$signing_root/BUILD-INPUT.json"
          mkdir -p "$signing_root/tools"
          cp "$input_root/tools/updater.pub" "$signing_root/tools/updater.pub"
          REPOSITORY="$REPOSITORY" VERSION="$VERSION" SOURCE_SHA="$SOURCE_SHA" \
            node scripts/release-metadata.mjs make-intent \
            --asset-dir "$assets" --build-input "$signing_root/BUILD-INPUT.json" \
            --signing-evidence "$assets/SIGNING-EVIDENCE.json" --output "$signing_root/RELEASE-INTENT.json"
          transfer_root="artifacts/signed-transfer"
          rm -rf -- "$transfer_root"
          mkdir -p "$transfer_root"
          transfer_archive="$transfer_root/codex-manager-v$VERSION-signed-transfer.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$transfer_archive" -C "$signing_root" \
            release-assets RELEASE-NOTES.md BUILD-INPUT.json RELEASE-INTENT.json tools
          (cd "$transfer_root" && shasum -a 256 "$(basename "$transfer_archive")" > "$(basename "$transfer_archive").sha256")

      - name: Remove ephemeral Apple credentials before any upload
        if: ${{ always() }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/codex-manager-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/codex-manager-certificate.p12"
          original_keychains="$RUNNER_TEMP/codex-manager-original-keychains.txt"
          if [ -f "$original_keychains" ]; then
            restored_keychains=()
            while IFS= read -r restored_keychain; do
              restored_keychain="$(sed -E 's/^[[:space:]]*\"?//; s/\"?[[:space:]]*$//' <<< "$restored_keychain")"
              [ -n "$restored_keychain" ] && restored_keychains+=("$restored_keychain")
            done < "$original_keychains"
            if [ "${#restored_keychains[@]}" -gt 0 ]; then security list-keychains -d user -s "${restored_keychains[@]}"; fi
          fi
          if [ -f "$keychain_path" ]; then
            security lock-keychain "$keychain_path" || true
            security delete-keychain "$keychain_path"
          fi
          rm -rf -- "$RUNNER_TEMP/codex-manager-tauri-signer"
          rm -f -- "$certificate_path" "$original_keychains"
          test ! -e "$keychain_path"
          test ! -e "$certificate_path"
          test ! -e "$original_keychains"

      - name: Upload sealed signed payload without signing credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-manager-macos-${{ needs.preflight.outputs.version }}-signed-transfer
          path: artifacts/signed-transfer/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Reconcile and remotely verify draft Release
    needs: [preflight, build, sign]
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        (
          (inputs.resume_run_id == '' && needs.build.result == 'success' && needs.sign.result == 'success') ||
          (inputs.resume_run_id != '' && needs.build.result == 'skipped' && needs.sign.result == 'skipped')
        )
      }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact release control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js for release reconciliation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify the runner is macOS arm64
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Download the exact sealed signed payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-manager-macos-${{ needs.preflight.outputs.version }}-signed-transfer
          path: signed-transfer
          run-id: ${{ inputs.resume_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Verify transfer identity, integrity, and release intent
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          TRANSFER_RUN_ID: ${{ inputs.resume_run_id || github.run_id }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          archive="signed-transfer/codex-manager-v$VERSION-signed-transfer.tar.gz"
          (cd signed-transfer && shasum -a 256 -c "$(basename "$archive").sha256")
          rm -rf -- release-work release-evidence
          mkdir -p release-work release-evidence
          tar -xzf "$archive" -C release-work
          test -f release-work/BUILD-INPUT.json
          test -f release-work/RELEASE-INTENT.json
          test -f release-work/RELEASE-NOTES.md
          test -f release-work/tools/updater.pub
          REPOSITORY="$REPOSITORY" VERSION="$VERSION" SOURCE_SHA="$SOURCE_SHA" \
            node scripts/release-metadata.mjs validate-intent \
            --intent release-work/RELEASE-INTENT.json \
            --asset-dir release-work/release-assets \
            --build-input release-work/BUILD-INPUT.json \
            --signing-evidence release-work/release-assets/SIGNING-EVIDENCE.json
          jq -e --arg runId "$TRANSFER_RUN_ID" '.signingRun.id == $runId' \
            release-work/RELEASE-INTENT.json >/dev/null

      - name: Create or reconcile one exact draft Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RESUME_RELEASE_ID: ${{ inputs.resume_release_id }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          command=(
            node scripts/release-github.mjs create-or-resolve-draft
            --notes release-work/RELEASE-NOTES.md
            --output release-work/release.json
          )
          if [ -n "$RESUME_RELEASE_ID" ]; then
            command+=(--resume-release-id "$RESUME_RELEASE_ID")
          fi
          "${command[@]}"
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' release-work/release.json)"
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload or reconcile the signed core asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-github.mjs sync-assets \
            --release-id "$RELEASE_ID" \
            --asset-dir release-work/release-assets \
            --output release-work/core-assets.json

      - name: Create deterministic updater metadata and complete provenance
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          assets=release-work/release-assets
          tarball="$assets/codex-manager-v$VERSION-aarch64.app.tar.gz"
          published_at="$(jq -er .signedAt "$assets/SIGNING-EVIDENCE.json")"
          node scripts/release-github.mjs make-latest \
            --signature-file "$tarball.sig" \
            --published-at "$published_at" \
            --notes "Codex Manager v$VERSION signed macOS arm64 release" \
            --output "$assets/latest.json"
          node scripts/release-metadata.mjs make-provenance \
            --asset-dir "$assets" \
            --build-input release-work/BUILD-INPUT.json \
            --signing-evidence "$assets/SIGNING-EVIDENCE.json" \
            --core-records release-work/core-assets.json \
            --release-id "$RELEASE_ID" \
            --output "$assets/BUILD-PROVENANCE.json"
          manifest="$assets/SHA256SUMS-v$VERSION-signed"
          manifest_name="$(basename "$manifest")"
          manifest_partial="$RUNNER_TEMP/$manifest_name.partial-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          (
            cd "$assets"
            find . -maxdepth 1 -type f ! -name "$manifest_name" -print0 |
              LC_ALL=C sort -z |
              xargs -0 shasum -a 256 |
              sed 's#  \./#  #'
          ) > "$manifest_partial"
          test "$(wc -l < "$manifest_partial" | tr -d ' ')" -eq 8
          mv -f -- "$manifest_partial" "$manifest"

      - name: Upload or reconcile the complete nine-asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-github.mjs sync-assets \
            --release-id "$RELEASE_ID" \
            --asset-dir release-work/release-assets \
            --output release-work/final-assets.json

      - name: Attest every final draft asset
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-work/release-assets/*
          show-summary: true

      - name: Preserve generated attestation evidence outside Release assets
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          test -f "$ATTESTATION_BUNDLE"
          [[ "$ATTESTATION_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ATTESTATION_URL" == "https://github.com/$GITHUB_REPOSITORY/attestations/$ATTESTATION_ID" ]]
          mkdir -p release-evidence/generated release-evidence/control
          cp "$ATTESTATION_BUNDLE" release-evidence/generated/generated-attestation-bundle.json
          jq -n \
            --arg id "$ATTESTATION_ID" \
            --arg url "$ATTESTATION_URL" \
            '{attestationId:$id,attestationUrl:$url}' \
            > release-evidence/generated/generated-attestation.json

      - name: Redownload by asset ID and verify the complete draft chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          remote="$RUNNER_TEMP/codex-manager-remote-release"
          rm -rf -- "$remote"
          mkdir -p "$remote" release-evidence/attestations release-evidence/control
          node scripts/release-github.mjs download-assets \
            --release-id "$RELEASE_ID" \
            --asset-dir release-work/release-assets \
            --destination "$remote" \
            --output release-evidence/control/remote-assets.json
          cmp -s release-work/final-assets.json release-evidence/control/remote-assets.json
          for local_asset in release-work/release-assets/*; do
            cmp -s "$local_asset" "$remote/$(basename "$local_asset")"
          done
          ASSET_DIR="$remote" \
          ASSET_RECORDS_PATH=release-evidence/control/remote-assets.json \
          BUILD_INPUT_PATH=release-work/BUILD-INPUT.json \
          RELEASE_ID="$RELEASE_ID" \
          REPOSITORY="$REPOSITORY" \
          SOURCE_SHA="$SOURCE_SHA" \
          TOOLS_DIR=release-work/tools \
          VERSION="$VERSION" \
            ./scripts/verify-macos-release.sh
          node scripts/release-github.mjs verify-attestations \
            --asset-dir "$remote" \
            --evidence-dir release-evidence/attestations \
            --output release-evidence/attestations/index.json
          node scripts/release-github.mjs verify-state \
            --mode draft \
            --release-id "$RELEASE_ID" \
            --output release-evidence/control/final-release.json
          node scripts/release-metadata.mjs make-verification \
            --mode draft \
            --release-id "$RELEASE_ID" \
            --asset-records release-evidence/control/remote-assets.json \
            --attestations-index release-evidence/attestations/index.json \
            --provenance "$remote/BUILD-PROVENANCE.json" \
            --output release-evidence/RELEASE-VERIFICATION.json
          cp release-work/release.json release-work/core-assets.json release-work/final-assets.json \
            release-evidence/control/

      - name: Upload remotely verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-manager-macos-${{ needs.preflight.outputs.version }}-release-evidence
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
